<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks — Biddle Systems</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%2329d0b8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='36' font-weight='700' fill='%2306080e' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#07090f; --ink:#f2f5fb; --ink-dim:#97a3bb; --ink-faint:#5c6884;
          --accent:#5b8cff; --accent-2:#29d0b8; --line:rgba(255,255,255,.09); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100%; overflow-x:hidden;
  }
  .glow { position:fixed; border-radius:50%; filter:blur(90px); opacity:.5; pointer-events:none; z-index:0; }
  .glow-a { width:46rem; height:46rem; top:-18rem; left:-12rem;
            background:radial-gradient(circle,rgba(91,140,255,.55),transparent 65%); }
  .glow-b { width:38rem; height:38rem; bottom:-16rem; right:-10rem;
            background:radial-gradient(circle,rgba(41,208,184,.38),transparent 65%); }
  .wrap { position:relative; z-index:1; flex:1; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center; padding:5rem 1.5rem 3rem; }
  .inner { max-width:34rem; animation:rise .8s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  .check {
    width:4rem; height:4rem; margin:0 auto 1.75rem; border-radius:50%;
    display:grid; place-items:center;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 18px 45px -12px rgba(41,208,184,.6);
  }
  .check svg { width:2rem; height:2rem; }
  h1 { margin:0 0 1rem; font-size:clamp(1.9rem,5vw,2.75rem); letter-spacing:-.03em; line-height:1.1; }
  p { margin:0 auto 2.25rem; max-width:28rem; font-size:1.02rem; line-height:1.65; color:var(--ink-dim); }
  .back {
    display:inline-flex; align-items:center; gap:.5rem;
    padding:.8rem 1.5rem; border-radius:.7rem;
    background:var(--ink); color:#06080e; text-decoration:none;
    font-weight:600; font-size:.95rem;
    transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 14px 34px -14px rgba(255,255,255,.4);
  }
  .back:hover { transform:translateY(-2px); }
  .back:focus-visible { outline:2px solid var(--accent-2); outline-offset:3px; }
  footer { position:relative; z-index:1; padding:1.75rem 1.5rem 2.25rem; text-align:center;
           font-size:.82rem; color:var(--ink-faint); border-top:1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <main class="wrap">
    <div class="inner">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#06080e" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1>Message received</h1>
      <p>Thanks for reaching out. We'll get back to you shortly — usually within one business day.</p>
      <a class="back" href="/">&larr; Back to homepage</a>
    </div>
  </main>

  <footer>&copy; 2026 Biddle Systems LLC. All rights reserved.</footer>
</body>
</html>
